<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Preview transport</title></head><body><script>
(() => {
  'use strict';
  // This page receives project snapshots, never editor preferences or recovery.
  // A transferred port binds the connection to the embedding editor window.
  const editorOrigin = new URLSearchParams(location.search).get('editor');
  const allowed = editorOrigin === 'https://instantviewer.online' || editorOrigin === location.origin ||
    /^http:\/\/(?:127\.0\.0\.1|localhost):\d+$/.test(editorOrigin || '');
  let connected = false;
  addEventListener('message', async event => {
    if (!allowed || connected || event.source !== parent || event.origin !== editorOrigin ||
        event.data?.type !== 'html-viewer:connect-preview' || !event.ports[0]) return;
    connected = true;
    const port = event.ports[0];
    try {
      const base = new URL('.', location.href);
      const script = new URL(event.data.script, base);
      if (script.origin !== base.origin || script.pathname !== new URL('preview-sw.js', base).pathname) throw new Error('Invalid preview worker');
      const registration = await navigator.serviceWorker.register(script, {
        scope: new URL('__html_viewer_project__/', base).pathname, updateViaCache: 'none'
      });
      let worker = registration.active;
      if (!worker) {
        worker = registration.installing || registration.waiting;
        await new Promise((resolve, reject) => {
          const timer = setTimeout(() => finish(new Error('Preview worker activation timed out')), 8000);
          const finish = error => { clearTimeout(timer); worker.removeEventListener('statechange', check); error ? reject(error) : resolve(); };
          const check = () => { if (worker.state === 'activated') finish(); else if (worker.state === 'redundant') finish(new Error('Preview worker redundant')); };
          worker.addEventListener('statechange', check); check();
        });
      }
      port.onmessage = request => {
        if (!['html-viewer:set-project', 'html-viewer:touch-project'].includes(request.data?.type)) return;
        try { (registration.active || worker).postMessage(request.data, request.ports); }
        catch (error) { request.ports[0]?.postMessage({ ok: false, error: error.message }); }
      };
      port.postMessage({ ok: true });
    } catch (error) { port.postMessage({ ok: false, error: error.message }); }
  });
})();
</script></body></html>
